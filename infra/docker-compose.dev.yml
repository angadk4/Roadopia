name: roadopia-dev

# Local dev stack (M0-T09): Fastify backend + a Valhalla placeholder, on a private
# bridge network. Caddy is an optional reverse proxy (enable with `--profile proxy`).
#   Up:    docker compose -f infra/docker-compose.dev.yml up
#   Health: curl http://localhost:8080/health  -> {"status":"ok"}

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    init: true
    environment:
      PORT: '8080'
      HOST: '0.0.0.0'
      VALHALLA_URL: 'http://valhalla:8002'
    ports:
      - '8080:8080'
    volumes:
      # Hot-reload: mount only source (node_modules stays as installed in the image).
      - ../backend/src:/app/backend/src
    depends_on:
      - valhalla
    networks:
      - roadopia

  valhalla:
    # Real Valhalla (M2-T03; replaces the M0-T09 placeholder). Pinned by digest —
    # v3.7.0-7e1ddb194 (same image the VPS serves; BD-14). Tiles + the PINNED config
    # live in ../data/valhalla (bind mount, gitignored; config canonical copy =
    # infra/valhalla/valhalla.json with allow_hard_exclusions=true — Spec §45/§28).
    # Build tiles first:
    #   cp infra/valhalla/valhalla.json data/valhalla/ && cp data/region-clipped.osm.pbf data/valhalla/
    #   SERVE=0 bash data/build_tiles.sh "$PWD/data/valhalla"
    # Published on 127.0.0.1 only (backend-on-host dev hits http://localhost:8002).
    image: ghcr.io/valhalla/valhalla@sha256:8aebd555b84163ff9d98d3199380f1653113f6fa28f3043a13c6baf609338f29
    command: ['valhalla_service', '/data/valhalla.json', '1']
    ports:
      - '127.0.0.1:8002:8002'
    volumes:
      - ../data/valhalla:/data
    networks:
      - roadopia

  caddy:
    image: caddy:2-alpine
    profiles: ['proxy'] # optional; off by default
    depends_on:
      - backend
    ports:
      - '80:80'
    volumes:
      - ../infra/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - roadopia

networks:
  roadopia:
    driver: bridge
