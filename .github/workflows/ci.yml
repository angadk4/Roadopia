name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# This skeleton uses NO secrets. Any future secrets come ONLY from GitHub Actions
# secrets (never committed) — Build Contract Hard rule H. Node 24 matches local dev +
# the Docker image; pnpm 11.8 requires Node >= 22 (it fails on 20). pnpm version is
# read from `packageManager`.

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  eval-smoke:
    name: Eval smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Per-push slice (M4-T14): dataset integrity + rules-parser floor. The
      # LLM prompt gate self-skips without the ANTHROPIC_API_KEY secret (it is
      # exercised on the nightly schedule — eval-nightly.yml — to keep per-push
      # cost at $0); the full planner-in-the-loop runs stay local/VPS.
      - run: pnpm -C eval run smoke

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # db's integration tests self-skip when no local Supabase stack is reachable
        # (they are the local `pnpm -C db test …` Verify gates; CI covers lint/types).
        package: [app, backend, shared, eval, data, db]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@roadopia/${{ matrix.package }}" test
