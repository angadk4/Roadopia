# Roadopia pnpm workspace — the JS/TS packages of the monorepo.
# Non-code directories (db, infra, docs) are NOT workspace packages: db = SQL
# migrations, infra = Docker/deploy, docs = the six spec docs.
# `data` became a package at SPK-10 (curvature compute lives in data/curvature/*;
# the OSM extracts/tiles it operates on stay gitignored). See decision-log BD-12.
packages:
  - 'app'
  - 'backend'
  - 'shared'
  - 'eval'
  - 'data'
  # db became a package at M2-T06 (integration tests for migrations/RPCs live in
  # db/tests; the SQL itself stays plain migrations under db/supabase/migrations).
  - 'db'
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@expo/cli@55.0.34'
  - '@expo/config-plugins@55.0.11'
  - '@expo/config-types@55.0.6'
  - '@expo/config@55.0.19'
  - '@expo/env@2.1.3'
  - '@expo/fingerprint@0.16.8'
  - '@expo/image-utils@0.8.15'
  - '@expo/local-build-cache-provider@55.0.15'
  - '@expo/log-box@55.0.13'
  - '@expo/metro-config@55.0.25'
  - '@expo/prebuild-config@55.0.20'
  - '@expo/require-utils@55.0.6'
  - '@expo/schema-utils@55.0.5'
  - babel-preset-expo@55.0.24
  - expo-asset@55.0.18
  - expo-constants@55.0.17
  - expo-file-system@55.0.24
  - expo-modules-autolinking@55.0.25
  - expo@55.0.28
  - expo-dev-client@55.0.37
  - expo-dev-launcher@55.0.38
  - expo-dev-menu@55.0.32
  - expo-location@55.1.12
  - expo-manifests@55.0.19

# Expo / React Native autolinking resolves packages (e.g. expo-modules-autolinking)
# from the project root via a plain require.resolve, which needs an npm-style FLAT
# node_modules — pnpm's default isolated layout hides transitive deps and EAS build
# fails with "Cannot find 'expo-modules-autolinking'". Hoisted fixes it (and Metro
# prefers it). Set HERE, not .npmrc — this pnpm reads linker config from the
# workspace file. (SPK-01 / BD-46; Node packages unaffected — full suite verified.)
nodeLinker: hoisted
