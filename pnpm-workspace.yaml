# Roadopia pnpm workspace — the JS/TS packages of the monorepo.
# Non-code directories (db, infra, docs) are NOT workspace packages: db = SQL
# migrations, infra = Docker/deploy, docs = the six spec docs.
# `data` became a package at SPK-10 (curvature compute lives in data/curvature/*;
# the OSM extracts/tiles it operates on stay gitignored). See decision-log BD-12.
packages:
  - 'app'
  - 'backend'
  - 'shared'
  - 'eval'
  - 'data'
  # db became a package at M2-T06 (integration tests for migrations/RPCs live in
  # db/tests; the SQL itself stays plain migrations under db/supabase/migrations).
  - 'db'
allowBuilds:
  esbuild: true
